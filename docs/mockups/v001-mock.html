<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockBench v001</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/roughjs@latest/bundled/rough.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
body { background: #faf9f7; font-family: system-ui, sans-serif; }
.dot-grid {
    background-image: radial-gradient(circle, #1E90FF 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 1;
}
</style>
</head>
<body class="h-screen overflow-hidden relative">
<!-- DOT GRID as separate layer with controlled opacity -->
<div class="absolute inset-0 dot-grid" style="opacity: 0.15;"></div>

<!-- TOOLBAR -->
<div class="fixed top-3 left-1/2 -translate-x-1/2 z-50 flex items-center gap-0.5 bg-white border border-gray-200 rounded-xl px-1.5 py-1 shadow-sm">
<button class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-50 text-[#1E90FF]"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3.5 1.5l1.5 12 3-4L12.5 8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
<button class="w-8 h-8 flex items-center justify-center rounded-lg text-[#605a52] hover:bg-gray-100"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="9" rx="1" stroke="currentColor" stroke-width="1.2"/></svg></button>
<button class="w-8 h-8 flex items-center justify-center rounded-lg text-[#605a52] hover:bg-gray-100"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><text x="4" y="12.5" font-size="12" font-weight="600" fill="currentColor">T</text></svg></button>
<button class="w-8 h-8 flex items-center justify-center rounded-lg text-[#605a52] hover:bg-gray-100"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2.5 1.5"/></svg></button>
<button class="w-8 h-8 flex items-center justify-center rounded-lg text-[#605a52] hover:bg-gray-100"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="4.5" width="12" height="7" rx="3.5" stroke="currentColor" stroke-width="1.1"/></svg></button>
<button class="w-8 h-8 flex items-center justify-center rounded-lg text-[#605a52] hover:bg-gray-100"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="4.5" width="12" height="7" rx="1" stroke="currentColor" stroke-width="1.1"/><line x1="4.5" y1="6" x2="4.5" y2="11" stroke="currentColor" stroke-width="1" opacity="0.5"/></svg></button>
<div class="w-px h-5 bg-gray-200 mx-1"></div>
<button class="w-8 h-8 flex items-center justify-center rounded-lg text-[#605a52] hover:bg-gray-100"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M6 10l4-4m0 0h-3m3 0v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.1" opacity="0.4"/></svg></button>
<div class="w-px h-5 bg-gray-200 mx-1"></div>
<button class="h-7 px-3 rounded-lg bg-[#1E90FF] text-white text-xs font-medium">▶ Present</button>
</div>

<!-- CANVAS SVG -->
<svg id="c" class="absolute inset-0 w-full h-full" style="z-index:1"></svg>

<!-- PROPERTY POPOVER — anchored below-right of selected element -->
<div class="fixed z-40 bg-white border border-gray-200 rounded-xl shadow-lg p-3 w-48" style="top:430px; left:120px;">
<div class="text-[11px] font-medium text-[#605a52] mb-2">Password field</div>
<div class="space-y-1.5">
<div class="flex items-center gap-1.5"><span class="text-[10px] text-gray-400 w-5">W</span><input value="264" class="flex-1 h-5 px-1.5 text-[11px] bg-gray-50 border border-gray-200 rounded"><span class="text-[10px] text-gray-400 w-5">H</span><input value="36" class="flex-1 h-5 px-1.5 text-[11px] bg-gray-50 border border-gray-200 rounded"></div>
<div class="flex items-center gap-1.5"><span class="text-[10px] text-gray-400 w-5">Txt</span><input value="Password" class="flex-1 h-5 px-1.5 text-[11px] bg-gray-50 border border-gray-200 rounded" style="font-family:Caveat"></div>
</div>
</div>

<!-- PAGE TABS -->
<div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 bg-white border border-gray-200 rounded-xl px-1.5 py-1 shadow-sm">
<button class="h-7 px-3 rounded-lg bg-blue-50 text-[#1E90FF] text-xs font-medium">Page 1</button>
<button class="h-7 px-3 rounded-lg text-[#605a52] text-xs hover:bg-gray-50">Page 2</button>
<button class="h-7 w-7 flex items-center justify-center rounded-lg text-gray-400 hover:bg-gray-50 text-sm">+</button>
</div>

<!-- ZOOM -->
<div class="fixed bottom-3 right-3 z-50 flex items-center gap-0.5 bg-white border border-gray-200 rounded-xl px-1 py-1 shadow-sm">
<button class="w-7 h-7 flex items-center justify-center rounded-lg text-[#605a52] hover:bg-gray-50 text-sm">−</button>
<span class="w-10 text-center text-[11px] text-gray-400 font-mono">100%</span>
<button class="w-7 h-7 flex items-center justify-center rounded-lg text-[#605a52] hover:bg-gray-50 text-sm">+</button>
</div>

<script>
const s = document.getElementById('c'), rc = rough.svg(s)
const d = e => s.appendChild(e)
const t = (x, y, str, sz) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', 'text')
    e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('fill', '#605a52')
    e.setAttribute('font-family', 'Caveat, cursive'); e.setAttribute('font-size', sz || 16)
    e.textContent = str; s.appendChild(e)
}
const rect = (x, y, w, h, opts) => d(rc.rectangle(x, y, w, h, opts))

const oc = { stroke: '#9a9590', strokeWidth: 1.2, roughness: 1.2, bowing: 1, fill: '#efeeeb', fillStyle: 'solid' }
const of_ = { stroke: '#504a44', strokeWidth: 1.4, roughness: 1.2, bowing: 1, fill: '#f7f6f4', fillStyle: 'solid' }
const ln = { stroke: '#9a9590', strokeWidth: 0.8, roughness: 1 }

// Centered layout — Login at left, Dashboard at right, gap for arrow
const LX = 120, LY = 160  // Login form origin
const DX = 620, DY = 160  // Dashboard origin

// === LOGIN FORM ===
rect(LX, LY, 320, 260, oc); t(LX+20, LY+35, 'Login Form', 20)
rect(LX+28, LY+52, 264, 36, of_); t(LX+40, LY+78, 'Email')
rect(LX+28, LY+104, 264, 36, of_); t(LX+40, LY+130, 'Password')
rect(LX+28, LY+156, 264, 36, of_); t(LX+120, LY+182, 'Sign In')
t(LX+90, LY+230, 'Forgot password?', 14)

// === SELECTION on Password field — must stay inside container ===
const px = LX+28, py = LY+104, pw = 264, ph = 36  // match password rect exactly
const pad = 3
const sx = px-pad, sy = py-pad, sw = pw+pad*2, sh = ph+pad*2
const sel = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
Object.entries({x:sx, y:sy, width:sw, height:sh, rx:3, fill:'none', stroke:'#1E90FF', 'stroke-width':'1.5', 'stroke-dasharray':'5 3'}).forEach(([k,v]) => sel.setAttribute(k, String(v)))
s.appendChild(sel)
// 8 handles: corners + midpoints
const hx = [sx, sx+sw/2, sx+sw], hy = [sy, sy+sh/2, sy+sh]
for (const x of hx) for (const y of hy) {
    if (x === sx+sw/2 && y === sy+sh/2) continue
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
    Object.entries({x:x-3, y:y-3, width:6, height:6, rx:1.5, fill:'#1E90FF'}).forEach(([k,v]) => r.setAttribute(k, String(v)))
    s.appendChild(r)
}

// === DASHBOARD ===
rect(DX, DY, 420, 260, oc); t(DX+20, DY+35, 'Dashboard', 20)
rect(DX+20, DY+48, 380, 32, of_); t(DX+32, DY+70, 'Home     Settings     Profile', 14)
rect(DX+20, DY+96, 115, 64, of_); t(DX+35, DY+118, 'Users', 14); t(DX+35, DY+140, '1,284', 18)
rect(DX+148, DY+96, 115, 64, of_); t(DX+163, DY+118, 'Revenue', 14); t(DX+163, DY+140, '$42k', 18)
rect(DX+276, DY+96, 115, 64, of_); t(DX+291, DY+118, 'Growth', 14); t(DX+291, DY+140, '+18%', 18)
rect(DX+20, DY+176, 380, 68, of_); t(DX+35, DY+202, 'Recent activity')
d(rc.line(DX+35, DY+212, DX+380, DY+212, ln))
t(DX+35, DY+232, 'User signed up — 2m ago', 13)

// === ARROW connecting Login → Dashboard ===
const arrowY = LY + 130
d(rc.line(LX+320, arrowY, DX, arrowY, { stroke: '#1E90FF', strokeWidth: 1.5, roughness: 0.5 }))
const ah = document.createElementNS('http://www.w3.org/2000/svg', 'polygon')
ah.setAttribute('points', `${DX-5},${arrowY-6} ${DX+5},${arrowY} ${DX-5},${arrowY+6}`)
ah.setAttribute('fill', '#1E90FF'); s.appendChild(ah)
t(LX+340, arrowY-8, 'on submit', 12)
</script>
</body>
</html>

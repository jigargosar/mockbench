<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rough.js Options Playground</title>
<!-- External dep: Rough.js itself (the subject of the playground). -->
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
    :root {
        --bg: #0b0d10;
        --panel: #14171c;
        --panel-2: #1a1e25;
        --border: #262b33;
        --text: #e5e7eb;
        --muted: #9aa3af;
        --accent: #60a5fa;
        --accent-2: #34d399;
        --card: #ffffff;
        --card-ink: #0f172a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        display: grid;
        grid-template-columns: 340px 1fr;
        grid-template-rows: 1fr auto;
        grid-template-areas:
            "controls preview"
            "controls prompt";
        height: 100vh;
        overflow: hidden;
    }
    .controls {
        grid-area: controls;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 16px;
    }
    .preview {
        grid-area: preview;
        overflow-y: auto;
        padding: 16px;
        background: var(--bg);
    }
    .prompt {
        grid-area: prompt;
        background: var(--panel-2);
        border-top: 1px solid var(--border);
        padding: 12px 16px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-height: 240px;
    }
    h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
    .group {
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
    }
    .group:last-child { border-bottom: none; }
    .group-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 10px;
    }
    .row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
    }
    .row label {
        color: var(--muted);
        font-size: 12px;
    }
    .row .val {
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--text);
        min-width: 40px;
        text-align: right;
    }
    .row input[type=range] {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: var(--accent);
    }
    .row input[type=number], .row input[type=text] {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 4px 6px;
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        width: 100%;
        grid-column: 1 / -1;
    }
    .row input[type=color] {
        border: none;
        background: transparent;
        padding: 0;
        width: 38px;
        height: 24px;
        cursor: pointer;
    }
    .row select {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 4px 6px;
        font-family: inherit;
        font-size: 12px;
        width: 100%;
        grid-column: 1 / -1;
    }
    .row .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-self: end;
    }
    .row .toggle input { accent-color: var(--accent); }
    .presets {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        margin-bottom: 10px;
    }
    .preset-btn {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
        border-radius: 3px;
        transition: background 120ms;
    }
    .preset-btn:hover {
        background: var(--border);
        border-color: var(--accent);
    }
    .preset-btn.active {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
    }
    .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
    }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 12px;
        position: relative;
    }
    .card-label {
        position: absolute;
        top: 4px;
        right: 8px;
        font-size: 10px;
        color: #94a3b8;
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        text-transform: lowercase;
    }
    .card svg {
        width: 100%;
        height: 160px;
        display: block;
    }
    .prompt-inner {
        flex: 1;
        min-width: 0;
    }
    .prompt-label {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 6px;
    }
    .prompt-text {
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-all;
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 3px;
        max-height: 180px;
        overflow-y: auto;
        margin: 0;
    }
    .copy-btn {
        background: var(--accent);
        border: none;
        color: var(--bg);
        padding: 8px 14px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 3px;
        flex-shrink: 0;
        align-self: flex-start;
    }
    .copy-btn:hover { background: var(--accent-2); }
    .summary {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
        font-style: italic;
    }
    .randomize {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 10px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        border-radius: 3px;
        width: 100%;
    }
    .randomize:hover { border-color: var(--accent); }
</style>
</head>
<body>

<aside class="controls">
    <h1>Rough.js Options</h1>

    <div class="group">
        <div class="group-title">Presets</div>
        <div class="presets" id="presets"></div>
    </div>

    <div class="group">
        <div class="group-title">General</div>
        <div class="row">
            <label>Roughness</label>
            <span class="val" id="roughness-val"></span>
            <input type="range" id="roughness" min="0" max="5" step="0.05">
        </div>
        <div class="row">
            <label>Bowing</label>
            <span class="val" id="bowing-val"></span>
            <input type="range" id="bowing" min="0" max="10" step="0.1">
        </div>
        <div class="row">
            <label>Seed</label>
            <input type="number" id="seed" min="0" max="2147483647" step="1">
        </div>
        <div class="row">
            <label>Preserve Vertices</label>
            <div class="toggle"><input type="checkbox" id="preserveVertices"></div>
        </div>
        <div class="row">
            <label>Disable Multi-Stroke</label>
            <div class="toggle"><input type="checkbox" id="disableMultiStroke"></div>
        </div>
        <div class="row">
            <label>Disable Multi-Stroke Fill</label>
            <div class="toggle"><input type="checkbox" id="disableMultiStrokeFill"></div>
        </div>
        <button class="randomize" id="randomize">Randomize Seed</button>
    </div>

    <div class="group">
        <div class="group-title">Stroke</div>
        <div class="row">
            <label>Stroke Color</label>
            <input type="color" id="stroke">
        </div>
        <div class="row">
            <label>Stroke Width</label>
            <span class="val" id="strokeWidth-val"></span>
            <input type="range" id="strokeWidth" min="0" max="10" step="0.1">
        </div>
        <div class="row">
            <label>Stroke Dash (comma)</label>
            <input type="text" id="strokeLineDash" placeholder="e.g. 6,3">
        </div>
        <div class="row">
            <label>Dash Offset</label>
            <span class="val" id="strokeLineDashOffset-val"></span>
            <input type="range" id="strokeLineDashOffset" min="0" max="30" step="0.5">
        </div>
    </div>

    <div class="group">
        <div class="group-title">Fill</div>
        <div class="row">
            <label>Enable Fill</label>
            <div class="toggle"><input type="checkbox" id="fillEnabled"></div>
        </div>
        <div class="row">
            <label>Fill Color</label>
            <input type="color" id="fill">
        </div>
        <div class="row">
            <label>Fill Style</label>
            <select id="fillStyle">
                <option value="hachure">hachure</option>
                <option value="solid">solid</option>
                <option value="zigzag">zigzag</option>
                <option value="cross-hatch">cross-hatch</option>
                <option value="dots">dots</option>
                <option value="dashed">dashed</option>
                <option value="zigzag-line">zigzag-line</option>
            </select>
        </div>
        <div class="row">
            <label>Fill Weight</label>
            <span class="val" id="fillWeight-val"></span>
            <input type="range" id="fillWeight" min="0.1" max="10" step="0.1">
        </div>
        <div class="row">
            <label>Hachure Angle</label>
            <span class="val" id="hachureAngle-val"></span>
            <input type="range" id="hachureAngle" min="-180" max="180" step="1">
        </div>
        <div class="row">
            <label>Hachure Gap</label>
            <span class="val" id="hachureGap-val"></span>
            <input type="range" id="hachureGap" min="1" max="40" step="0.5">
        </div>
        <div class="row">
            <label>Dash Offset (fill)</label>
            <span class="val" id="dashOffset-val"></span>
            <input type="range" id="dashOffset" min="0" max="40" step="0.5">
        </div>
        <div class="row">
            <label>Dash Gap (fill)</label>
            <span class="val" id="dashGap-val"></span>
            <input type="range" id="dashGap" min="0" max="40" step="0.5">
        </div>
        <div class="row">
            <label>Zigzag Offset</label>
            <span class="val" id="zigzagOffset-val"></span>
            <input type="range" id="zigzagOffset" min="0" max="20" step="0.5">
        </div>
    </div>

    <div class="group">
        <div class="group-title">Curves &amp; Paths</div>
        <div class="row">
            <label>Curve Step Count</label>
            <span class="val" id="curveStepCount-val"></span>
            <input type="range" id="curveStepCount" min="3" max="30" step="1">
        </div>
        <div class="row">
            <label>Curve Fitting</label>
            <span class="val" id="curveFitting-val"></span>
            <input type="range" id="curveFitting" min="0.5" max="1" step="0.01">
        </div>
        <div class="row">
            <label>Simplification (path)</label>
            <span class="val" id="simplification-val"></span>
            <input type="range" id="simplification" min="0" max="1" step="0.01">
        </div>
    </div>
</aside>

<main class="preview">
    <div class="preview-grid" id="grid">
        <div class="card"><div class="card-label">rectangle</div><svg data-shape="rectangle"></svg></div>
        <div class="card"><div class="card-label">ellipse</div><svg data-shape="ellipse"></svg></div>
        <div class="card"><div class="card-label">circle</div><svg data-shape="circle"></svg></div>
        <div class="card"><div class="card-label">line</div><svg data-shape="line"></svg></div>
        <div class="card"><div class="card-label">polygon</div><svg data-shape="polygon"></svg></div>
        <div class="card"><div class="card-label">linearPath</div><svg data-shape="linearPath"></svg></div>
        <div class="card"><div class="card-label">arc</div><svg data-shape="arc"></svg></div>
        <div class="card"><div class="card-label">curve</div><svg data-shape="curve"></svg></div>
        <div class="card"><div class="card-label">path</div><svg data-shape="path"></svg></div>
    </div>
</main>

<footer class="prompt">
    <div class="prompt-inner">
        <div class="prompt-label">Options (drop into any rough call)</div>
        <pre class="prompt-text" id="prompt-out"></pre>
        <div class="summary" id="summary"></div>
    </div>
    <button class="copy-btn" id="copy">Copy</button>
</footer>

<script>
(() => {
    const DEFAULTS = {
        roughness: 1,
        bowing: 1,
        seed: 1,
        stroke: '#000000',
        strokeWidth: 1,
        strokeLineDash: '',
        strokeLineDashOffset: 0,
        fillEnabled: false,
        fill: '#60a5fa',
        fillStyle: 'hachure',
        fillWeight: 1,
        hachureAngle: -41,
        hachureGap: 8,
        dashOffset: 0,
        dashGap: 0,
        zigzagOffset: 0,
        curveStepCount: 9,
        curveFitting: 0.95,
        simplification: 0,
        preserveVertices: false,
        disableMultiStroke: false,
        disableMultiStrokeFill: false,
    };

    const PRESETS = {
        'Default': {},
        'Wireframe Clean': {
            roughness: 0.8, bowing: 0.5, strokeWidth: 1.2, stroke: '#1f2937',
        },
        'Architect': {
            roughness: 1.2, bowing: 1, strokeWidth: 1.2, stroke: '#111827',
            fillEnabled: true, fill: '#e5e7eb', fillStyle: 'hachure',
            hachureGap: 6, hachureAngle: -41, fillWeight: 1,
        },
        'Blueprint': {
            roughness: 0.6, bowing: 0.8, strokeWidth: 1.5, stroke: '#1e3a8a',
            fillEnabled: true, fill: '#dbeafe', fillStyle: 'cross-hatch',
            hachureGap: 10, hachureAngle: -45, fillWeight: 0.8,
        },
        'Pencil': {
            roughness: 1.8, bowing: 1.5, strokeWidth: 1, stroke: '#374151',
        },
        'Marker': {
            roughness: 0.8, bowing: 0.5, strokeWidth: 3, stroke: '#111827',
            fillEnabled: true, fill: '#fef3c7', fillStyle: 'solid',
            disableMultiStroke: true,
        },
        'Hatched Ink': {
            roughness: 1, bowing: 1, strokeWidth: 1.2, stroke: '#0f172a',
            fillEnabled: true, fill: '#0f172a', fillStyle: 'hachure',
            hachureGap: 4, hachureAngle: -30, fillWeight: 0.6,
        },
        'Dotted Fill': {
            roughness: 1, strokeWidth: 1.4, stroke: '#111827',
            fillEnabled: true, fill: '#111827', fillStyle: 'dots',
            hachureGap: 7, fillWeight: 2,
        },
    };

    const state = { ...DEFAULTS };

    // Build preset buttons
    const presetsEl = document.getElementById('presets');
    Object.keys(PRESETS).forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = name;
        btn.dataset.preset = name;
        btn.addEventListener('click', () => applyPreset(name));
        presetsEl.appendChild(btn);
    });

    function applyPreset(name) {
        Object.assign(state, DEFAULTS, PRESETS[name]);
        syncControls();
        document.querySelectorAll('.preset-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.preset === name);
        });
        updateAll();
    }

    function clearActivePreset() {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    }

    // Wire controls
    const bindRange = (id) => {
        const el = document.getElementById(id);
        const val = document.getElementById(id + '-val');
        el.addEventListener('input', () => {
            state[id] = parseFloat(el.value);
            val.textContent = el.value;
            clearActivePreset();
            updateAll();
        });
        return () => {
            el.value = state[id];
            val.textContent = Number(state[id]).toString();
        };
    };

    const bindCheckbox = (id) => {
        const el = document.getElementById(id);
        el.addEventListener('change', () => {
            state[id] = el.checked;
            clearActivePreset();
            updateAll();
        });
        return () => { el.checked = !!state[id]; };
    };

    const bindColor = (id) => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => {
            state[id] = el.value;
            clearActivePreset();
            updateAll();
        });
        return () => { el.value = state[id]; };
    };

    const bindText = (id) => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => {
            state[id] = el.value;
            clearActivePreset();
            updateAll();
        });
        return () => { el.value = state[id]; };
    };

    const bindNumber = (id) => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => {
            state[id] = parseInt(el.value, 10) || 0;
            clearActivePreset();
            updateAll();
        });
        return () => { el.value = state[id]; };
    };

    const syncFns = [
        bindRange('roughness'),
        bindRange('bowing'),
        bindNumber('seed'),
        bindCheckbox('preserveVertices'),
        bindCheckbox('disableMultiStroke'),
        bindCheckbox('disableMultiStrokeFill'),
        bindColor('stroke'),
        bindRange('strokeWidth'),
        bindText('strokeLineDash'),
        bindRange('strokeLineDashOffset'),
        bindCheckbox('fillEnabled'),
        bindColor('fill'),
        (() => {
            const el = document.getElementById('fillStyle');
            el.addEventListener('change', () => {
                state.fillStyle = el.value;
                clearActivePreset();
                updateAll();
            });
            return () => { el.value = state.fillStyle; };
        })(),
        bindRange('fillWeight'),
        bindRange('hachureAngle'),
        bindRange('hachureGap'),
        bindRange('dashOffset'),
        bindRange('dashGap'),
        bindRange('zigzagOffset'),
        bindRange('curveStepCount'),
        bindRange('curveFitting'),
        bindRange('simplification'),
    ];

    function syncControls() { syncFns.forEach(fn => fn()); }

    document.getElementById('randomize').addEventListener('click', () => {
        state.seed = Math.floor(Math.random() * 2147483647);
        syncControls();
        clearActivePreset();
        updateAll();
    });

    // Build options object for rough.js
    function buildOptions() {
        const opts = {
            roughness: state.roughness,
            bowing: state.bowing,
            seed: state.seed,
            stroke: state.stroke,
            strokeWidth: state.strokeWidth,
            fillStyle: state.fillStyle,
            fillWeight: state.fillWeight,
            hachureAngle: state.hachureAngle,
            hachureGap: state.hachureGap,
            curveStepCount: state.curveStepCount,
            curveFitting: state.curveFitting,
            simplification: state.simplification,
            preserveVertices: state.preserveVertices,
            disableMultiStroke: state.disableMultiStroke,
            disableMultiStrokeFill: state.disableMultiStrokeFill,
            strokeLineDashOffset: state.strokeLineDashOffset,
            dashOffset: state.dashOffset,
            dashGap: state.dashGap,
            zigzagOffset: state.zigzagOffset,
        };
        if (state.fillEnabled) opts.fill = state.fill;
        const dash = state.strokeLineDash.trim();
        if (dash) {
            opts.strokeLineDash = dash.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
        }
        return opts;
    }

    // Build a minimal options object (only non-default values) for the prompt output
    function buildMinimalOptions() {
        const opts = buildOptions();
        const minimal = {};
        for (const key of Object.keys(opts)) {
            const def = DEFAULTS[key];
            const cur = opts[key];
            if (key === 'strokeLineDash') {
                if (Array.isArray(cur) && cur.length) minimal[key] = cur;
                continue;
            }
            if (def === undefined) { minimal[key] = cur; continue; }
            if (cur !== def) minimal[key] = cur;
        }
        if (state.fillEnabled && opts.fill !== undefined) minimal.fill = opts.fill;
        return minimal;
    }

    // Render all shapes
    function render() {
        const opts = buildOptions();
        document.querySelectorAll('svg[data-shape]').forEach(svg => {
            svg.innerHTML = '';
            svg.setAttribute('viewBox', '0 0 220 160');
            const rc = rough.svg(svg);
            let node;
            try {
                switch (svg.dataset.shape) {
                    case 'rectangle':
                        node = rc.rectangle(30, 30, 160, 100, opts); break;
                    case 'ellipse':
                        node = rc.ellipse(110, 80, 160, 100, opts); break;
                    case 'circle':
                        node = rc.circle(110, 80, 110, opts); break;
                    case 'line':
                        node = rc.line(20, 80, 200, 80, opts); break;
                    case 'polygon':
                        node = rc.polygon(
                            [[110, 20], [195, 70], [170, 140], [50, 140], [25, 70]],
                            opts); break;
                    case 'linearPath':
                        node = rc.linearPath(
                            [[20, 120], [60, 90], [100, 110], [140, 60], [180, 80], [200, 40]],
                            opts); break;
                    case 'arc':
                        node = rc.arc(110, 90, 160, 110, Math.PI, 2 * Math.PI, true, opts); break;
                    case 'curve':
                        const pts = [];
                        for (let i = 0; i <= 20; i++) {
                            const x = 10 + (200 / 20) * i;
                            const y = 80 + Math.sin((Math.PI / 10) * i) * 40;
                            pts.push([x, y]);
                        }
                        node = rc.curve(pts, opts); break;
                    case 'path':
                        node = rc.path(
                            'M40,120 Q40,30 110,30 Q180,30 180,120 Q180,140 110,140 Q40,140 40,120 Z',
                            opts); break;
                }
                if (node) svg.appendChild(node);
            } catch (e) {
                // Seed or other combos can briefly throw; skip this frame
                console.warn(e);
            }
        });
    }

    // Build the prompt text
    const promptOut = document.getElementById('prompt-out');
    const summaryEl = document.getElementById('summary');

    function formatOptions(obj) {
        const keys = Object.keys(obj);
        if (keys.length === 0) return '{}';
        const lines = keys.map(k => {
            const v = obj[k];
            let formatted;
            if (typeof v === 'string') formatted = `'${v}'`;
            else if (Array.isArray(v)) formatted = `[${v.join(', ')}]`;
            else formatted = String(v);
            return `    ${k}: ${formatted},`;
        });
        return '{\n' + lines.join('\n') + '\n}';
    }

    function buildSummary(minimal) {
        if (Object.keys(minimal).length === 0) return 'Built-in Rough.js defaults.';
        const bits = [];
        if ('roughness' in minimal) {
            const r = minimal.roughness;
            if (r < 0.7) bits.push('crisp lines');
            else if (r > 1.5) bits.push('very sketchy');
            else if (r !== 1) bits.push('moderately sketchy');
        }
        if ('bowing' in minimal) {
            if (minimal.bowing < 0.5) bits.push('straight strokes');
            else if (minimal.bowing > 2) bits.push('strong line bow');
        }
        if ('strokeWidth' in minimal) {
            if (minimal.strokeWidth >= 2.5) bits.push('heavy stroke');
            else if (minimal.strokeWidth < 1) bits.push('thin stroke');
        }
        if (minimal.fill !== undefined) {
            const style = minimal.fillStyle || 'hachure';
            bits.push(`${style} fill`);
        }
        if (minimal.disableMultiStroke) bits.push('single-pass stroke');
        return bits.length ? `Effect: ${bits.join(', ')}.` : '';
    }

    function updatePrompt() {
        const minimal = buildMinimalOptions();
        promptOut.textContent = formatOptions(minimal);
        summaryEl.textContent = buildSummary(minimal);
    }

    function updateAll() {
        render();
        updatePrompt();
    }

    // Copy button
    document.getElementById('copy').addEventListener('click', async () => {
        const btn = document.getElementById('copy');
        try {
            await navigator.clipboard.writeText(promptOut.textContent);
            const orig = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.textContent = orig; }, 1200);
        } catch {
            btn.textContent = 'Copy failed';
        }
    });

    // Init
    function init() {
        if (typeof rough === 'undefined') {
            document.querySelectorAll('.card svg').forEach(svg => {
                svg.outerHTML = '<div style="color:#ef4444;font-size:11px;padding:8px;">Rough.js failed to load (offline?). Check the script tag.</div>';
            });
            return;
        }
        applyPreset('Architect');
    }

    init();
})();
</script>

</body>
</html>
